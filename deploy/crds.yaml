apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gpuintegrityincidents.dualkey.io
spec:
  group: dualkey.io
  scope: Namespaced
  names:
    kind: GPUIntegrityIncident
    plural: gpuintegrityincidents
    singular: gpuintegrityincident
    shortNames: [gii]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: GPU, type: string, jsonPath: .spec.gpu}
        - {name: Node, type: string, jsonPath: .spec.node}
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Policy, type: string, jsonPath: .status.policy}
        - {name: Vendor-Diag, type: string, jsonPath: .status.diagnostics.result}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            Opened when Dual-Key quarantines a GPU. Holds the evidence, the vendor telemetry and
            diagnostic for the node, and every action taken. Set spec.release to true after
            repair; the GPU is then re-checked against its partners before the incident resolves.
          properties:
            spec:
              type: object
              properties:
                gpu: {type: string}
                node: {type: string}
                vendor: {type: string}
                group: {type: string}
                release: {type: boolean}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
